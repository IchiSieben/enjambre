/*__FONTS__*/
/* Landing design system (Landing/src/styles/global.css): same tokens, dark first. */
:root,:root[data-theme="dark"]{
  --bg:#0D1117;--surface:#161B22;--surface-2:#1E242E;--border:#30363D;--fg:#E6EDF3;--muted:#8B949E;
  --accent:#2DD4BF;--accent-strong:#2DD4BF;
  --good:#3FB950;--warn:#D29922;--crit:#F85149;
  --n1:#2DD4BF;--n2:#F5B841;--n3:#A78BFA;--n4:#F472B6;--n5:#60A5FA;--pc:#4CA3FF;--mac:#C9D1D9;--lx:#F59E0B;
  color-scheme:dark;
}
:root[data-theme="light"]{
  --bg:#FFFFFF;--surface:#F6F8FA;--surface-2:#ECF0F4;--border:#D0D7DE;--fg:#1F2328;--muted:#59636E;
  --accent:#0D9488;--accent-strong:#0F766E;
  --good:#1A7F37;--warn:#9A6700;--crit:#CF222E;
  --n1:#0D9488;--n2:#B7791F;--n3:#7C3AED;--n4:#DB2777;--n5:#2563EB;--pc:#0067C0;--mac:#6E7781;--lx:#B45309;
  color-scheme:light;
}
:root{
  --display:'Space Grotesk Variable','Space Grotesk',ui-sans-serif,system-ui,-apple-system,'Segoe UI',sans-serif;
  --mono:'JetBrains Mono Variable',ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  --ease:cubic-bezier(.22,1,.36,1);--t-hover:200ms;--r:12px;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}

.btn:hover{border-color:var(--accent)}

.xl{display:flex;gap:6px}.xl>span{flex:1;text-align:center;font-size:11px;color:var(--muted);min-width:14px;font-family:var(--mono)}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:12px;color:var(--muted);margin:4px 0 8px}

.tlbar{display:flex;flex-wrap:wrap;align-items:center;gap:6px;margin:4px 0 6px;font-size:12px}.tlbar .btn{min-width:34px}

#proyectos:not(.all) tr.more{display:none}
/* F2 feedback: icons, money, traffic lights, alerts, interactive charts */
.ic{width:14px;height:14px;fill:currentColor;vertical-align:-2px;flex:none}
.ic.os{width:15px;height:15px;margin-right:5px;color:var(--fg)}
.icons{display:inline-flex;gap:6px;align-items:center;color:var(--muted)}
.icons .ic{width:15px;height:15px}
.usd{color:var(--good);font-weight:600;font-variant-numeric:tabular-nums}
.usd.xl{font-size:40px;letter-spacing:-.02em;line-height:1.05}
.usd.l{font-size:20px;font-weight:700}
.flow{display:inline-flex;align-items:center;gap:3px;font-size:11px;border:1px solid color-mix(in srgb,var(--n2) 55%,transparent);color:var(--fg);border-radius:99px;padding:1px 7px;white-space:nowrap}
.light{display:inline-flex;align-items:center;gap:6px;font-size:12px}
.light .dot{width:10px;height:10px;box-shadow:0 0 0 3px color-mix(in srgb,currentColor 18%,transparent)}
.alertchip{font:inherit;font-size:12px;border-radius:99px;padding:3px 10px;text-decoration:none;white-space:nowrap;border:1px solid}
.alertchip.crit{color:var(--crit);border-color:var(--crit);background:color-mix(in srgb,var(--crit) 12%,transparent)}

.alertchip.ok{color:var(--good);border-color:color-mix(in srgb,var(--good) 50%,transparent)}
.alertbox{border-color:var(--crit);background:color-mix(in srgb,var(--crit) 7%,var(--surface))}
.alertbox.warn{border-color:var(--warn);background:color-mix(in srgb,var(--warn) 7%,var(--surface))}
.chart{width:100%;height:auto;display:block;touch-action:pan-y}
.chart text{fill:var(--muted);font:10px var(--mono)}
.chart .col{fill:transparent;cursor:crosshair}
.chart .col:hover,.chart .col.on{fill:color-mix(in srgb,var(--accent) 10%,transparent)}
.chart .grid{stroke:var(--border);stroke-width:1}
.range{font-size:13px;color:var(--muted);margin:6px 0 0}
@media (max-width:560px){.usd.xl{font-size:32px}.fresh .alertchip{display:none}}
/* Second pass: brand-colour icons with the Landing's chip interaction (Landing global.css .logo-chip:
   colour wash from the logo, tinted border, the logo tilts), node labels, filters, job detail. */
:root{--spring:cubic-bezier(.34,1.56,.64,1)}
.lg{--logo:var(--ld,currentColor)}
:root[data-theme="light"] .lg{--logo:var(--ll,var(--ld,currentColor))}
.lg svg,svg.lg{fill:var(--logo)}
.lchip{position:relative;isolation:isolate;display:inline-flex;align-items:center;gap:6px;font:11px/1.4 var(--mono);color:var(--muted);border:1px solid var(--border);border-radius:6px;padding:3px 8px;background:color-mix(in srgb,var(--bg) 40%,transparent);cursor:default;transition:color var(--t-hover) var(--ease),border-color var(--t-hover) var(--ease)}
.lchip.only{padding:3px 4px}
.lchip::after{content:"";position:absolute;inset:0;z-index:-1;border-radius:inherit;background:radial-gradient(circle at 1rem 50%,color-mix(in srgb,var(--logo) 24%,transparent),transparent 75%);opacity:0;transform:scale(.4);transform-origin:1rem 50%;transition:opacity 380ms var(--ease),transform 380ms var(--spring)}
.lchip svg{width:14px;height:14px;flex:none;transition:transform 380ms var(--spring)}
.lchip:hover,.lchip:focus-visible,.lchip.on{color:var(--fg);border-color:color-mix(in srgb,var(--logo) 60%,var(--border));outline:none}
.lchip:hover::after,.lchip:focus-visible::after,.lchip.on::after{opacity:1;transform:none}
.lchip:hover svg,.lchip:focus-visible svg,.lchip.on svg{transform:translateY(-1px) scale(1.2) rotate(-8deg)}
@media (prefers-reduced-motion:reduce){.lchip::after,.lchip svg{transition:none;transform:none!important}}
.dev{display:inline-flex;align-items:center;gap:5px;white-space:nowrap;font-weight:600;font-variant-caps:all-small-caps;letter-spacing:.04em;padding:0 7px 1px 5px;border-radius:99px;background:color-mix(in srgb,var(--dc,var(--muted)) 16%,transparent);border:1px solid color-mix(in srgb,var(--dc,var(--muted)) 45%,transparent)}
.dev.only{padding:1px 3px}.split{display:inline-flex;gap:4px;flex-wrap:wrap}
th[data-s]{cursor:pointer;user-select:none}th[aria-sort=descending]::after{content:" ▾"}th[aria-sort=ascending]::after{content:" ▴"}th[data-s]:hover{color:var(--fg)}
.filters input{font:inherit;color:var(--fg);background:var(--bg);border:1px solid var(--border);border-radius:6px;padding:3px 6px;max-width:150px}
.dev svg{width:15px;height:15px;flex:none}
#tip b{color:var(--fg)}
#tip .w{display:block;color:var(--muted);margin-top:2px}
.filters{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:4px 0 10px;font-size:12px;color:var(--muted)}

.filters select:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
tr.sel td{background:color-mix(in srgb,var(--accent) 10%,transparent)}
pre.log{font:11px/1.45 var(--mono);background:var(--bg);border:1px solid var(--border);border-radius:8px;padding:8px 10px;max-height:260px;overflow:auto;white-space:pre-wrap;word-break:break-word;margin:6px 0 0}
.kv{display:grid;grid-template-columns:max-content 1fr;gap:4px 14px;font-size:13px;margin-top:8px}
.kv>span:nth-child(odd){color:var(--muted)}
.trio{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,200px),1fr));gap:12px;margin-top:8px}
.trio .l{color:var(--muted);font-size:13px;font-weight:600;letter-spacing:.02em}
.trio .s{color:var(--muted);font-size:12px;margin-top:2px}
.tl .hl{stroke:var(--fg);stroke-width:2}
.tl.focus [data-k]:not(.hl){opacity:.22}
.tabs3{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,320px),1fr));gap:12px;margin-top:12px}
.tabs3 .card{padding:10px 12px}
.st-ok{color:var(--good)}.st-bad{color:var(--crit)}.st-mid{color:var(--warn)}
details.tests{margin-top:10px}details.tests>summary{cursor:pointer;color:var(--fg2,var(--muted));font-size:13px}
.cghead{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:8px}.seg{display:inline-flex;gap:4px;flex-wrap:wrap}.seg .btn.on{background:var(--accent);color:var(--bg);border-color:var(--accent)}
.heat{display:grid;grid-template-columns:28px repeat(24,minmax(0,1fr));gap:2px;margin-top:8px;max-width:820px;font:10px var(--mono);color:var(--muted)}.heat i{height:18px;border-radius:2px;background:linear-gradient(color-mix(in srgb,var(--n1) var(--a),transparent),color-mix(in srgb,var(--n1) var(--a),transparent)),color-mix(in srgb,var(--border) 55%,transparent);}.heat i:hover,.heat i.on{outline:2px solid var(--fg)}.heat .hd{align-self:center}.heat .hh{text-align:left}
@keyframes fin{from{opacity:0;transform:translateY(5px)}to{opacity:1;transform:none}}
.fx,tr.new{animation:fin .45s var(--ease) both}tr.new td:first-child{box-shadow:inset 3px 0 var(--accent)}
.g-kpi>.card{background:linear-gradient(165deg,color-mix(in srgb,var(--fg) 7%,transparent),transparent 42%),var(--surface);box-shadow:inset 0 1px 0 color-mix(in srgb,var(--fg) 12%,transparent),0 10px 24px -18px #000}
#live.on{background:var(--accent);color:var(--bg);border-color:var(--accent)}
@media (prefers-reduced-motion:reduce){.fx,tr.new{animation:none}}
.mgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,230px),1fr));gap:10px}.mcard{border-top:3px solid var(--fc);display:flex;flex-direction:column;gap:6px}
.mh{display:flex;gap:10px;align-items:center}.mf svg{width:26px;height:26px;display:block}.mt{display:flex;flex-wrap:wrap;gap:4px;align-items:center;font-size:12px}
.mst{font:600 12px inherit;border-radius:99px;padding:2px 10px;border:1px solid var(--sc);color:var(--fg);background:color-mix(in srgb,var(--sc) 20%,transparent);cursor:pointer}.mst:disabled{cursor:default}
.medit{display:flex;flex-wrap:wrap;gap:6px;align-items:center}.medit select,.medit input{font:inherit;font-size:12px;color:var(--fg);background:var(--bg);border:1px solid var(--border);border-radius:6px;padding:2px 6px;max-width:100%}

/* live.js (prompts 18-19): the strip, running cards, node chips and the node detail */
.nowbar{max-width:1180px;margin:8px auto 0;display:flex;flex-wrap:wrap;align-items:center;gap:6px 12px;font-size:13px;color:var(--muted)}
.nowbar b{color:var(--fg);font-weight:600}.nowbar .on{color:var(--good)}
.ndot{width:9px;height:9px;border-radius:50%;background:var(--muted);flex:none}
.nowbar.run .ndot{background:var(--good);animation:pulse 2.4s var(--ease) infinite}
.sleepy{font-size:12px;font-weight:600;color:#fff;background:var(--crit);border-radius:99px;padding:3px 10px}
.rgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,330px),1fr));gap:10px;margin:0 0 12px}
.rcard{border-left:4px solid var(--rc,var(--good));display:flex;flex-direction:column;gap:4px;padding:12px 14px}
.rcard .rh{display:flex;align-items:center;gap:8px;flex-wrap:wrap}.rcard .rh b{font-size:15px;word-break:break-word}
.rcard .rm{font-size:12.5px;color:var(--muted)}.rcard .rl{font:12px/1.4 var(--mono);color:var(--fg);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rst{font:600 11px var(--mono);letter-spacing:.04em;text-transform:uppercase;border-radius:99px;padding:2px 8px;color:var(--bg);background:var(--rc,var(--good))}
.rcard .bar{flex:0 0 4px;height:4px;border-radius:2px;background:var(--surface-2);overflow:hidden}.rcard .bar i{display:block;height:100%;background:var(--rc,var(--good));width:var(--w)}
.wlist{display:flex;flex-wrap:wrap;gap:6px;margin:4px 0 12px}.wlist .chip{font-size:12px}
.tchips{display:flex;flex-wrap:wrap;gap:6px;margin:4px 0 6px}.tchip{font:12px var(--mono);border:1px solid var(--border);border-radius:99px;padding:2px 8px;background:var(--surface-2)}
.prio{font:600 11px var(--mono);border-radius:99px;padding:1px 8px;border:1px solid var(--pc-c);color:var(--pc-c)}
.prio.alta{--pc-c:var(--crit)}.prio.normal{--pc-c:var(--muted)}.prio.baja{--pc-c:var(--n5)}.prio.nocturna{--pc-c:var(--n3)}
.motivo{font-size:12.5px;color:var(--fg);border-left:2px solid var(--rc,var(--muted));padding-left:8px}
.ctl{display:flex;flex-wrap:wrap;gap:6px;align-items:center}.ctl .btn,.ctl select{padding:1px 9px;font-size:12px}
.ctlcmd{font:12px var(--mono);background:var(--surface-2);padding:2px 6px;border-radius:4px;user-select:all}
.pol{font-size:12px;color:var(--muted);margin:2px 0 6px}
.tchip.warn{border-color:var(--warn);color:var(--warn)}.tchip.crit{border-color:var(--crit);color:var(--crit)}
#teledet .nsel{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-bottom:10px}#teledet .nsel .btn.on{background:var(--accent);color:var(--bg);border-color:var(--accent)}
.gauges{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,150px),1fr));gap:10px}
.gauge{display:flex;flex-direction:column;align-items:center;text-align:center;gap:2px;padding:10px}.gauge svg{width:96px;height:58px}
.gauge .gv{font:600 18px var(--mono)}.gauge .gl{font-size:12px;color:var(--muted)}.gauge .gs{font-size:11.5px;color:var(--muted)}
.sparks{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,260px),1fr));gap:10px;margin-top:10px}
.spark{padding:10px 12px}.spark svg{width:100%;height:64px;display:block}.spark .sh{display:flex;justify-content:space-between;font-size:12px;color:var(--muted)}.spark .sh b{color:var(--fg);font-family:var(--mono)}.spark .swin{font-size:11.5px;color:var(--muted);margin-top:2px}
#teledet,#corriendo{scroll-margin-top:120px}
.ptag{font:11px var(--mono);border-radius:99px;padding:1px 7px;background:color-mix(in srgb,var(--accent) 22%,transparent);color:var(--fg)}
</style>
</head>
<body>
<header class="top"><div class="topbar">
  <div class="brand">
    <svg class="hex" viewBox="0 0 32 32" aria-hidden="true"><path d="M16 2l12 7v14l-12 7-12-7V9z" fill="none" stroke="var(--accent)" stroke-width="2"/><circle cx="16" cy="16" r="4" fill="var(--accent)"/></svg>
    <div><div class="kicker">enjambre</div><b>Visor</b></div>
  </div>
  <div class="fresh"><a class="alertchip ok" id="alertchip" href="#alertas" hidden></a><span class="pulse" id="pulse"></span><span id="fresh">—</span>
    <span class="sleepy" id="demo" hidden title="Modo demo: un enjambre inventado (nombres, proyectos y números sintéticos) pasado por el código real del visor" style="color:var(--accent);border-color:var(--accent)">demo · datos sintéticos</span>
    <span class="sleepy" id="sleepy" hidden title="live.json no se actualiza: el bucle «enjambre live --serve» (tarea \enjambre\live) no está corriendo. Arráncalo con: python enjambre.py live --serve">visor dormido</span>
    <button class="btn" id="reload" type="button" hidden title="Volver a leer la instantánea">recargar</button>
    <button class="btn" id="live" type="button" hidden aria-pressed="true" title="Recargar sola cuando haya una instantánea nueva (sondeo cada 30 s)">en vivo</button>
    <button class="btn" id="theme" type="button" aria-label="Cambiar tema">◐</button></div>
</div>
<div class="nowbar" id="nowbar" hidden></div><span id="nowsr" aria-live="polite" style="position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)"></span>
<nav class="jump" aria-label="Secciones"><a href="#vivo">Ahora</a><a href="#consumo">Consumo</a><a href="#proyectos">Proyectos</a><a href="#modelos">Modelos locales</a><a href="#historia">Historia</a></nav>
</header>
<main id="app"><p class="empty">Cargando…</p></main>
<div id="tip" role="tooltip"></div>
<script>
let D = /*__DATA__*/null;
const DATA_URL = 'data.php';           // web copy: same page, data fetched behind the login
const esc = (s) => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmtTok = (n) => n == null ? '—' : n >= 1e9 ? (n/1e9).toFixed(2)+' G' : n >= 1e6 ? (n/1e6).toFixed(1)+' M' : n >= 1e3 ? Math.round(n/1e3)+' k' : String(n);
const usd = (x) => x == null ? '—' : '$' + (x >= 1000 ? Math.round(x).toLocaleString('es-PE') : x >= 100 ? x.toFixed(0) : x.toFixed(2));
const sec = (x) => x == null ? '—' : x >= 3600 ? (x/3600).toFixed(1)+' h' : x >= 60 ? Math.round(x/60)+' min' : x.toFixed(1)+' s';
const hrs = (s) => s == null ? '—' : (s/3600).toFixed(s >= 36000 ? 0 : 1) + ' h';
const ago = (s) => s == null ? '—' : s < 90 ? Math.round(s)+' s' : s < 5400 ? Math.round(s/60)+' min' : s < 172800 ? (s/3600).toFixed(1)+' h' : Math.round(s/86400)+' d';
const lima = (ts) => new Date(ts*1000 - 5*3600e3).toISOString();                       // Lima, UTC-5, no DST
const day = (ts) => ts ? lima(ts).slice(0,10) : '—';
const dtm = (ts) => ts ? lima(ts).slice(0,16).replace('T',' ') : '—';
const isoTs = (s) => { const t = Date.parse(s || ''); return isNaN(t) ? null : t/1000; };
const tok = (u) => u ? u.in + u.out + u.cw + u.cr : 0;
const pct = (v) => Math.max(0, Math.min(100, v || 0));
const MES = ['ene','feb','mar','abr','may','jun','jul','ago','sep','oct','nov','dic'];
// Traffic light from ~/.claude/rules/thresholds.json (ids visor-*-amber / *-red, quota-5h).
// No readable threshold = grey and said so: a green we cannot back is a claim, not a reading.
function light(v, amberId, redId) {
  const T = D.thresholds || {}, a = T[amberId], r = T[redId];
  if (v == null) return {col: 'var(--muted)', word: 'sin lectura', lvl: 'none'};
  if (a == null && r == null) return {col: 'var(--muted)', word: 'sin umbral en thresholds.json', lvl: 'none'};
  if (r != null && v >= r) return {col: 'var(--crit)', word: `rojo: ≥ ${r} %`, lvl: 'crit'};
  if (a != null && v >= a) return {col: 'var(--warn)', word: `ámbar: ≥ ${a} %${r != null ? `, rojo en ${r} %` : ''}`, lvl: 'warn'};
  return {col: 'var(--good)', word: `verde: bajo ${a ?? r} %`, lvl: 'good'};
}
// ---------------------------------------------------------------- icons and node labels
const OSI = /*__OSICONS__*/{};   // Windows/macOS/Linux marks, put in the template by build.py
const icon = (id) => (D.icons || {})[id] || OSI[id];
const cvars = (i) => i && i.color ? `--ld:${esc(i.color.d)};--ll:${esc(i.color.l)}` : '';
// Every icon is defined once (sprite() at the top of the page) and used by reference: the
// projects table repeats the same logos on many rows, and a colour logo's gradients have ids.
const svgOf = (i, id) => `<svg viewBox="${esc(i.vb)}" aria-hidden="true"><use href="#ic-${esc(id)}"/></svg>`;
const sprite = () => `<svg width="0" height="0" style="position:absolute" aria-hidden="true"><defs>${Object.entries({...OSI, ...(D.icons || {})})
  .map(([id, i]) => `<symbol id="ic-${esc(id)}" viewBox="${esc(i.vb)}">${i.svg}</symbol>`).join('')}</defs></svg>`;
// A tech chip like the Landing's: brand colour, wash + tilt on hover/focus, tooltip with what it is.
const tchip = (id, only) => { const i = icon(id); if (!i) return '';
  return `<span class="lchip lg${only ? ' only' : ''}" style="${cvars(i)}" tabindex="0" data-tt="${esc(i.name)}" data-tw="${esc(i.what || '')}" aria-label="${esc(i.name)}">${svgOf(i, id)}${only ? '' : esc(i.name)}</span>`; };
// A node is read by its label (nodes.toml: "PC", "Mac mini", "Laptop"), never by its id.
const lab = (n) => ((D.nodes || {})[n] || {}).label || ({win: 'PC', mac: 'Mac'})[n] || n || '—';
// Free text from the ledger or a node (route reason, alert reason, error) names nodes by id:
// show the label there too ("tests -> Mac mini: first free node of prefer ['Mac mini', 'PC']").
const deid = (t) => { let x = String(t ?? '').replace(/(?:\/Users|\/home)\/[^\/\s"'<>|:]+|[A-Za-z]:(?:\\+|\/)Users(?:\\+|\/)[^\\\/\s"'<>|:]+/gi, '~'); for (const n of Object.keys(D.nodes || {})) if (/^[a-z0-9_-]+$/i.test(n))
  x = x.replace(new RegExp('(^|[^\\w/.-])' + n + '(?![\\w/-]|\\.\\w)', 'g'), (m, a) => a + lab(n)); return x; };
const osOf = (n) => ((D.nodes || {})[n] || {}).os || (n === 'mac' ? 'darwin' : n === 'win' ? 'windows' : '');
const osSvg = (n) => { const i = OSI['os-' + osOf(n)]; return i ? `<span class="lg" style="${cvars(i)};display:inline-flex">${svgOf(i, 'os-' + osOf(n))}</span>` : sw(n); };
const dev = (n, text) => `<span class="dev${text === false ? ' only' : ''}" style="--dc:${colorOf(n)}" title="${esc(lab(n))} · ${esc((OSI['os-' + osOf(n)] || {}).name || '')}">${osSvg(n)}${text === false ? '' : `<span>${esc(typeof text === 'string' ? text : lab(n))}</span>`}</span>`;
const money = (x, cls) => `<span class="usd ${cls || ''}">${usd(x)}</span>`;
const flow = (from, to) => Object.entries(to || {}).map(([n, k]) => `<span class="flow" title="${k} trabajo(s) del enjambre enviados desde esta sesión a ${esc(lab(n))}">${osSvg(from)}→${osSvg(n)}${esc(lab(from))}→${esc(lab(n))} · ${k}</span>`).join(' ');
let NODES = [], now = Date.now()/1000;
const colorOf = (n) => ({windows: 'var(--pc)', darwin: 'var(--mac)', linux: 'var(--lx)'})[osOf(n)] || `var(--n${(NODES.indexOf(n) % 5 + 5) % 5 + 1})`;
const sw = (n) => `<span class="sw" style="background:${colorOf(n)}"></span>`;
const stIcon = (s) => s === 'ok' ? '<span class="st-ok">✓ ok</span>' : s === 'incomplete' ? '<span class="st-mid">◐ incompleto</span>' : s === 'running' ? '<span class="st-mid">● corriendo</span>' : s === 'queued' ? '<span class="muted">… en cola</span>' : s === 'muerto' ? '<span class="st-bad">✗ muerto (sin supervisor)</span>' : `<span class="st-bad">✗ ${esc(s)}</span>`;

// What the page remembers across the 2-minute refresh: kept in the URL hash, restored on render.
const S = {p: null, j: null, jp: '', mt: '', md: '', hl: null};
const HK = ['p', 'j', 'jp', 'mt', 'md', 'ms', 'ps', 'pd', 'pq', 'pf', 'pt', 'cg', 'tn', 'tw'];
const readHash = () => { const h = new URLSearchParams(location.hash.replace(/^#/, ''));
  for (const k of HK) if (h.has(k)) S[k] = h.get(k); };
const writeHash = () => { const h = new URLSearchParams(); for (const k of HK) if (S[k]) h.set(k, S[k]);
  history.replaceState(null, '', h.toString() ? '#' + h.toString() : location.pathname + location.search); };

// ---------------------------------------------------------------- live
function live() {
  const alive = NODES.filter(n => D.nodes[n].alive).length;
  const q = D.queue || {queue:[],running:[],done:[]};
  const running = q.running.length + Object.values(D.running_models || {}).filter(Boolean).length;
  const sessions = NODES.reduce((a,n) => a + (D.nodes[n].sessions || []).length, 0);
  const busy = NODES.filter(n => ((D.nodes[n].presence || {}).busy || {}).alive);
  const A = D.alerts || {};
  return `<section id="vivo"><h2>Ahora</h2>
    <div id="corriendo"></div>
    <div class="grid g-kpi">
      ${kpi('Aparatos vivos', `${alive}<span class="muted" style="font-size:18px"> / ${NODES.length}</span>`, NODES.map(n => `${esc(lab(n))} ${D.nodes[n].alive ? '✓' : '✗'}`).join(' · '))}
      ${kpi('Cola de watch · corriendo', running, `${q.queue.length} en cola${busy.length ? ' · ocupado: ' + busy.map(n => esc(lab(n))).join(', ') : ''}`)}
      ${kpi('Sesiones abiertas', sessions, NODES.map(n => `${esc(lab(n))} ${(D.nodes[n].sessions || []).length}`).join(' · '))}
      ${kpi('Fallidos · incompletos', `<span style="color:${A.failed_7d ? 'var(--crit)' : 'inherit'}">${A.failed_7d ?? '—'}</span><span class="muted" style="font-size:18px"> · </span><span style="color:${A.incomplete_7d ? 'var(--warn)' : 'inherit'}">${A.incomplete_7d ?? '—'}</span>`, `últimos ${A.days || 7} días · ${D.ledger_n ?? '—'} trabajos en el ledger`)}
    </div>
    ${alertsBox()}
    <div class="grid g-nodes" style="margin-top:12px">${NODES.map(nodeCard).join('')}</div>
    <div id="teledet"></div>
    <div id="sesiones-snap">${sessionsList()}</div></section>`;
}

// Everything that is red or amber right now, in one box at the top (and a chip in the header).
function problems() {
  const A = D.alerts || {}, out = [];
  if (A.failed_7d) out.push({lvl: 'crit', t: `${A.failed_7d} trabajo(s) fallido(s) en ${A.days} días`});
  if (A.incomplete_7d) out.push({lvl: 'warn', t: `${A.incomplete_7d} incompleto(s) en ${A.days} días (permisos denegados o rama sin subir)`});
  for (const n of NODES) {
    const x = D.nodes[n], L = lab(n);
    if (!x.alive) out.push({lvl: 'crit', t: `${L}: sin respuesta`});
    else if (x.stale) out.push({lvl: 'warn', t: `${L}: instantánea vieja (hace ${ago(x.age_s)})`});
    (x.disks || []).forEach(d => { const l = light(100 - 100*d.free_gb/d.total_gb, 'visor-disk-amber', 'visor-disk-red');
      if (l.lvl === 'crit' || l.lvl === 'warn') out.push({lvl: l.lvl, t: `${L} ${d.mount}: disco ${l.word} (${Math.round(d.free_gb)} GB libres)`}); });
    const m = x.memory || {};
    if (m.free_pct != null) { const l = light(100 - m.free_pct, 'visor-mem-amber', 'visor-mem-red');
      if (l.lvl === 'crit' || l.lvl === 'warn') out.push({lvl: l.lvl, t: `${L}: memoria ${l.word} (${m.free_pct} % libre)`}); }
  }
  const q = D.quota;
  if (q) [['five_pct', 'visor-quota-5h-amber', 'quota-5h', '5 h'], ['week_pct', 'visor-quota-7d-amber', 'visor-quota-7d-red', '7 días']].forEach(([k, a, r, w]) => {
    const l = light(q[k], a, r); if (l.lvl === 'crit' || l.lvl === 'warn') out.push({lvl: l.lvl, t: `cuota de ${w} al ${q[k]} %: ${l.word}${q.stale ? ` (última lectura, hace ${ago(now - q.ts)})` : ''}`}); });
  return out;
}

const span = (a, b) => !a ? '—' : day(a) === day(b) ? `${dtm(a)}${b - a > 60 ? '–' + dtm(b).slice(11) : ''}` : `${dtm(a)} – ${dtm(b)}`;
const stWord = (st, n) => st === 'failed' ? `<span class="err">✗ ${n > 1 ? n + ' fallidos' : 'fallido'}</span>` : `<span style="color:var(--warn)">◐ ${n > 1 ? n + ' incompletos' : 'incompleto'}</span>`;
const whyCell = (w) => w ? esc(deid(w)) : '<span class="muted">sin causa registrada</span>';
function alertsBox() {
  const P = problems(), A = D.alerts || {};
  // "9 fallidos: mac inalcanzable 10:06–11:55" is worth more than 9 equal rows (F3)
  const rows = (A.groups || []).filter(g => g.recent).slice(0, 10).map(g => `<tr class="click" tabindex="0" data-j="${esc((g.ids || [])[0] || '')}" title="ver el último y su log">
    <td>${stWord(g.status, g.n)}</td><td class="wrap">${whyCell(g.why)}</td><td>${(g.nodes || []).map(n => dev(n)).join(' ')}</td><td class="mono">${span(g.first, g.last)}</td></tr>`).join('');
  const T = A.test_rows || [];
  const tests = T.length ? `<details class="tests"><summary>pruebas · ${A.tests_7d ?? T.length} en ${A.days || 7} días <span class="muted">(no cuentan en el semáforo)</span></summary>
    <div class="scroll"><table><tbody>${T.slice(0, 20).map(r => `<tr class="click" tabindex="0" data-j="${esc(r.id || '')}"><td>${stWord(r.status, 1)}</td><td class="wrap">${whyCell(r.why)}</td><td>${dev(r.node)}</td><td class="mono">${dtm(r.t0 || isoTs(r.start))}</td></tr>`).join('')}</tbody></table></div>
    <div class="note">Prueba = repo <code>enjambre-sandbox</code>, worker <code>stub</code>, pruebas de fuego (<code>e3-…</code>, <code>…-smoke</code>) o <code>test: true</code> en el TASK.</div></details>` : '';
  if (!P.length) return `<div class="card" id="alertas" style="margin-top:12px"><span class="light" style="color:var(--good)"><span class="dot" style="background:var(--good)"></span>Todo en verde: ningún fallo en ${A.days || 7} días, discos, memoria y cuota bajo sus umbrales.</span>${tests}</div>`;
  const crit = P.some(p => p.lvl === 'crit');
  return `<div class="card alertbox ${crit ? '' : 'warn'}" id="alertas" style="margin-top:12px"><h3>${crit ? '⚠ Atención' : 'Para revisar'} · ${P.length}</h3>
    ${P.map(p => `<div class="light" style="color:${p.lvl === 'crit' ? 'var(--crit)' : 'var(--warn)'};margin:3px 14px 3px 0"><span class="dot" style="background:currentColor"></span><span style="color:var(--fg)">${esc(p.t)}</span></div>`).join('')}
    ${rows ? `<div class="scroll" style="margin-top:8px"><table><thead><tr><th>Cuántos</th><th>Por qué</th><th>Aparato</th><th>Cuándo (Lima)</th></tr></thead><tbody>${rows}</tbody></table></div>
    <div class="note">Una fila por causa. Tócala para ver el último trabajo de ese grupo y su log.</div>` : ''}${tests}</div>`;
}
const kpi = (l, v, s) => `<div class="card kpi"><div class="l">${l}</div><div class="v">${v}</div>${s ? `<div class="s">${s}</div>` : ''}</div>`;

function nodeCard(n) {
  const x = D.nodes[n], p = x.presence || {}, m = x.memory || {};
  const lvl = p.level || 'unknown';
  const lc = {local:'var(--good)',ready:'var(--good)',ssh:'var(--warn)',ping:'var(--warn)',down:'var(--crit)'}[lvl] || 'var(--muted)';
  const b = p.busy;
  const disks = (x.disks || []).map(d => { const used = 100 - 100*d.free_gb/d.total_gb, l = light(used, 'visor-disk-amber', 'visor-disk-red'); return `
    <div class="row"><span class="mono"><span class="dot" style="background:${l.col};margin-right:6px" title="${esc(l.word)}"></span>${esc(d.mount)}</span><span>${Math.round(d.free_gb)} GB libres de ${Math.round(d.total_gb)}</span></div>
    <div class="meter" role="img" aria-label="${used.toFixed(0)} % usado, ${esc(l.word)}"><i style="width:${used}%;background:${l.col}"></i></div>`; }).join('');
  const ml = light(m.free_pct != null ? 100 - m.free_pct : null, 'visor-mem-amber', 'visor-mem-red');
  const pm = (p.mounts && p.mounts.mounts) ? p.mounts.mounts.map(mt => ({name: mt.name, ok: mt.ok})) : (x.mounts || []).map(mt => ({name: mt.share, ok: mt.ok}));
  const mo = x.models;
  return `<div class="card">
    <div class="node-h"><b>${dev(n)}</b><span class="chip"><span class="dot" style="background:${lc}"></span>${esc(lvl)}</span></div>
    <div class="tchips" data-tn="${esc(n)}"></div>
    ${b && b.alive ? `<div class="busy">Ocupado por <b>${esc(b.quien)}</b> (${esc(b.tipo)}) desde ${esc((b.desde||'').replace('T',' ').slice(0,16))}</div>` : ''}
    <div class="row"><span>Instantánea <span class="muted">(discos, memoria, montajes)</span></span><span class="${x.stale ? 'err' : ''}">${x.stale ? 'VIEJA · ' : ''}hace ${ago(x.age_s)}</span></div>
    ${x.error ? `<div class="row err"><span>error</span><span>${esc(deid(x.error))}</span></div>` : ''}
    ${m.free_pct != null ? `<div class="row"><span><span class="dot" style="background:${ml.col};margin-right:6px" title="${esc(ml.word)}"></span>Memoria libre</span><span>${m.free_pct} % de ${m.total_gb} GB</span></div>
      <div class="meter" role="img" aria-label="${100-m.free_pct} % en uso, ${esc(ml.word)}"><i style="width:${100-m.free_pct}%;background:${ml.col}"></i></div>` : ''}
    ${disks}
    ${mo ? `<div class="row"><span>Gestor de modelos</span><span>${mo.health && mo.health.running ? 'corriendo: ' + esc(mo.health.task || mo.health.running) : 'en reposo'} · ${(mo.health||{}).queued ?? 0} en cola</span></div>` : ''}
    <details><summary>Montajes, tmux y fuentes</summary>
      <div class="row"><span>Montajes</span><span>${pm.length ? pm.map(mt => `${mt.ok ? '✓' : '✗'} ${esc(mt.name)}`).join(' · ') : '<span class="muted">ninguno</span>'}</span></div>
      <div class="row"><span>tmux</span><span>${(x.tmux || []).length ? esc(x.tmux.join(', ')) : '—'}</span></div>
      ${mo ? `<div class="row"><span>Servidor de modelos (RSS)</span><span>${mo.server_rss_mb ?? '—'} MB</span></div>` : ''}
      <div class="row"><span>Fuentes con error</span><span>${(x.errors || []).length ? `<span class="err">${esc(x.errors.join(', '))}</span>` : 'ninguna'}</span></div>
    </details></div>`;
}

function sessionsList() {
  const rows = [];
  for (const n of NODES) for (const s of (D.nodes[n].sessions || [])) rows.push([n, s]);
  if (!rows.length) return `<div class="card empty" style="margin-top:12px">No hay sesiones de Claude Code abiertas.</div>`;
  return `<h3 style="margin:20px 0 8px">Sesiones de Claude Code abiertas</h3><div class="sess">${rows.map(([n,s]) => `
    <div class="card"><span class="dot" style="background:${s.status === 'busy' ? 'var(--accent)' : 'var(--muted)'}" title="${s.status === 'busy' ? 'trabajando' : 'en espera'}"></span>
      <span class="p">${esc(s.project)}${s.name ? ` <span class="muted" style="font-weight:400">· ${esc(s.name)}</span>` : ''}</span>
      <span class="chip">${dev(n)}</span>

// ---------------------------------------------------------------- consumption
// The history range, merged over nodes (each node's history.db: since = first session start).
function histRange() {
  const hs = Object.values(D.history_status || {}).filter(Boolean);
  const s = hs.map(h => h.since).filter(Boolean), u = hs.map(h => h.until).filter(Boolean);
  return s.length ? {since: day(Math.min(...s)), until: day(Math.max(...u)), t0: Math.min(...s)} : null;
}
const isoWeek = (d) => { const t = new Date(d + 'T00:00:00Z'), wd = (t.getUTCDay() + 6) % 7;
  t.setUTCDate(t.getUTCDate() - wd + 3); const y = t.getUTCFullYear(), j4 = new Date(Date.UTC(y, 0, 4));
  const w = 1 + Math.round(((t - j4) / 864e5 - 3 + (j4.getUTCDay() + 6) % 7) / 7); return `${y}-S${String(w).padStart(2, '0')}`; };
// Calendar buckets over every day of the history (week = ISO, Monday first; month = calendar),
// from history_by_day: a session's cost on the day it started. days = days the bucket covers
// inside the history, so the first and the current bucket average over the days they really have.
function buckets(keyOf) {
  const R = histRange(); if (!R) return [];
  const HB = D.history_by_day || {}, out = new Map();
  for (let t = R.t0; day(t) <= D.today; t += 86400) {
    const d = day(t), k = keyOf(d); let b = out.get(k);
    if (!b) out.set(k, b = {k, first: d, last: d, days: 0, nodes: {}, cost: 0, sessions: 0});
    b.last = d; b.days++;
    for (const [n, v] of Object.entries(HB[d] || {})) { const x = b.nodes[n] || (b.nodes[n] = {cost: 0, sessions: 0, active_s: 0});
      x.cost += v.cost || 0; x.sessions += v.sessions || 0; x.active_s += v.active_s || 0; b.cost += v.cost || 0; b.sessions += v.sessions || 0; }
  }
  return [...out.values()];
}
const shortDay = (d) => `${+d.slice(8)} ${MES[+d.slice(5, 7) - 1]}`;

// Stacked bars per bucket and per machine, in SVG; one transparent column per bucket carries the
// tooltip (hover, keyboard focus or tap). No library: CSP-safe, works offline.
const TIPS = {};
function stackChart(id, keys, val, tipRow, opts) {
  const W = 720, H = 190, L = 46, B = 20, T = 8, n = keys.length, cw = (W - L - 6) / n;
  const tot = keys.map(d => NODES.reduce((a, nd) => a + (val(nd, d) || 0), 0));
  const max = Math.max(1e-9, ...tot), y = (v) => T + (H - T - B) * (1 - v / max);
  const step = Math.max(1, Math.ceil(n / (opts.labels || 10))), fmt = opts.fmt || (d => d.slice(5));
  TIPS[id] = keys.map((d, i) => `<b>${opts.head ? opts.head(i) : d}</b> · total ${usd(tot[i])}${opts.extra ? opts.extra(i) : ''}<br>` + NODES.map(nd => `${sw(nd)}${esc(lab(nd))}: ${tipRow(nd, d)}`).join('<br>'));
  const cols = keys.map((d, i) => { let acc = 0; const x = L + i * cw;
    const rects = NODES.map(nd => { const v = val(nd, d) || 0; if (v <= 0) return ''; const y1 = y(acc + v), y0 = y(acc); acc += v;
      return `<rect x="${(x + 1).toFixed(1)}" y="${y1.toFixed(1)}" width="${Math.max(1, cw - 2).toFixed(1)}" height="${Math.max(1, y0 - y1).toFixed(1)}" rx="2" fill="${colorOf(nd)}"/>`; }).join('');
    const lab_ = i % step === 0 || i === n - 1 ? `<text x="${(x + cw / 2).toFixed(1)}" y="${H - 6}" text-anchor="middle">${esc(fmt(d, i))}</text>` : '';
    return rects + lab_ + `<rect class="col" x="${x.toFixed(1)}" y="${T}" width="${cw.toFixed(1)}" height="${H - T - B}" data-tip="${id}:${i}" tabindex="0" aria-label="${esc(opts.head ? opts.head(i) : d)}: ${usd(tot[i])}"/>`; }).join('');
  const grid = [0, .5, 1].map(f => `<line class="grid" x1="${L}" x2="${W - 4}" y1="${y(max * f).toFixed(1)}" y2="${y(max * f).toFixed(1)}"/><text x="${L - 6}" y="${(y(max * f) + 3).toFixed(1)}" text-anchor="end">${usd(max * f)}</text>`).join('');
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(opts.label)}">${grid}${cols}</svg>`;
}
const legend = () => `<div class="legend">${NODES.map(n => `<span>${sw(n)}${dev(n)}</span>`).join('')}<span>· hora de Lima · pasa el dedo o el cursor</span></div>`;

// One chart, four lenses (F3 §11): last 8 days by response, or the whole history by day / ISO

}

// Weekday x hour, Lima (F3 §11): when the owner programs. Each session's cost spread evenly over
// the clock hours it was open (collect.py), so it is approximate and says so.
const DW = ['lun', 'mar', 'mié', 'jue', 'vie', 'sáb', 'dom'];
function heatCard() {
  const H = D.heat || {}, ns = NODES.filter(n => H[n]); if (!ns.length) return '';
  const v = (d, h) => ns.reduce((a, n) => a + ((H[n][d] || [])[h] || 0), 0);
  let max = 1e-9, top = [0, 0], byD = DW.map(() => 0);
  DW.forEach((_, d) => { for (let h = 0; h < 24; h++) { const x = v(d, h); byD[d] += x; if (x > max) { max = x; top = [d, h]; } } });
  const tips = [], cells = DW.map((w, d) => `<span class="hd">${w}</span>` + Array.from({length: 24}, (_, h) => { const x = v(d, h);
    tips.push(`<b>${w} ${h}:00–${h + 1}:00</b> · ≈ ${usd(x)}${ns.length > 1 ? '<br>' + ns.map(n => `${sw(n)}${esc(lab(n))} ${usd((H[n][d] || [])[h] || 0)}`).join(' · ') : ''}`);
    return `<i style="--a:${Math.round(100 * Math.sqrt(x / max))}%" data-tip="hm:${tips.length - 1}" tabindex="0" aria-label="${w} ${h} h: ${usd(x)}"></i>`; }).join('')).join('');
  TIPS.hm = tips;
  const hours = '<span></span>' + Array.from({length: 24}, (_, h) => `<span class="hh">${h % 3 ? '' : h}</span>`).join('');
  const bd = byD.indexOf(Math.max(...byD)), missing = NODES.filter(n => !H[n]);

    <div class="heat">${hours}${cells}</div>
    <div class="note">Más gasto: <b>${DW[top[0]]} de ${top[1]}:00 a ${top[1] + 1}:00</b>; el día más cargado es el <b>${DW[bd]}</b>. Aproximado: el coste de cada sesión se reparte por igual entre las horas que estuvo abierta (también las de pausa). Escala de raíz cuadrada para que las horas flojas se vean.${missing.length ? ` Sin datos aún de ${missing.map(lab).map(esc).join(', ')} (su colector no trae el mapa todavía).` : ''}</div></div>`;
}

// Project timeline (F3 §10). Drawn at the container's real pixel width (text never shrinks on a
// phone), ticks on Lima midnights/hours, three fixed labelled lanes, wheel / pinch / drag zoom,
// tooltips, and two-way highlight with the three lists below.
let TL = null;
const TSTEP = [900, 1800, 3600, 3*3600, 6*3600, 12*3600, 86400, 2*86400, 7*86400, 14*86400, 30*86400, 91*86400];
function tlSetup(tl, subs, jobs, t0, t1) {
  const tips = [], lanes = [];
  const S_ = tl.map(t => { const s = t.start || t0, e = Math.max(t.end || s, s + 60);
    let l = lanes.findIndex(end => end < s); if (l < 0) { l = lanes.length; lanes.push(0); } lanes[l] = e + (t1 - t0) * 0.002;
    const sent = Object.entries(t.sent_to || {}).map(([n, c]) => `${esc(lab(t.node))}→${esc(lab(n))}: ${c} trabajo(s)`).join(' · ');
    tips.push(`<b>${dtm(s)}</b> · ${sw(t.node)}${esc(lab(t.node))}<br>${hrs(t.active_s)} activas · ${t.prompts} prompts · ${t.subagents} subagentes<br>${fmtTok(t.tokens)} tokens · ${usd(t.cost)}${sent ? '<br>' + sent : ''}`);
    return {s, e, l, i: tips.length - 1, node: t.node, w: t.window || '', sent: !!sent}; });
  const A = subs.map(x => { tips.push(`<b>${dtm(x.start)}</b> · subagente${x.type ? ' <b>' + esc(x.type) + '</b>' : ''}${x.desc ? '<br>' + esc(x.desc) : ''}<br>${fmtTok(x.tokens)} tokens · ${usd(x.cost)}`);
    return {s: x.start || t0, i: tips.length - 1}; });
  const J = jobs.map(j => { const s = j.t0 || isoTs(j.start) || t0;
    tips.push(`<b>${dtm(s)}</b> · trabajo del enjambre en ${esc(lab(j.node))}<br>${esc(j.type || '')} · ${j.status === 'ok' ? 'ok' : esc(j.status)}${j.cost_usd != null ? ' · ' + usd(j.cost_usd) : ''}${j.reason || j.why ? '<br>' + esc(deid(j.reason || j.why)) : ''}`);
    return {s, i: tips.length - 1, c: j.status === 'ok' ? 'var(--good)' : j.status === 'incomplete' ? 'var(--warn)' : 'var(--crit)'}; });
  TIPS.tl = tips;
  TL = {S: S_, A, J, t0, t1, v: [t0, t1], nl: Math.max(1, lanes.length)};
}
const TG = 98, TR = 12;                                   // left gutter for the lane names, right margin
function drawTL() {
  const svg = document.getElementById('tl'); if (!svg || !TL) return;
  const W = Math.max(300, svg.parentNode.clientWidth), H = 16, [v0, v1] = TL.v, pw = W - TG - TR;
  const X = (t) => (TG + pw * (t - v0) / (v1 - v0)).toFixed(1);
  const yS = 28, yA = yS + TL.nl * H + 12, yJ = yA + 26, h = yJ + 26;
  const step = TSTEP.find(x => (v1 - v0) / x <= pw / 64) || TSTEP[TSTEP.length - 1];
  let ticks = '';
  for (let L = Math.ceil((v0 - 18000) / step) * step; L + 18000 <= v1; L += step) {     // Lima = UTC-5
    const t = L + 18000, hm = dtm(t).slice(11), x = X(t);
    ticks += `<line class="grid" x1="${x}" x2="${x}" y1="18" y2="${h - 2}"/><text x="${x}" y="13" text-anchor="middle">${step >= 86400 || hm === '00:00' ? shortDay(day(t)) : hm}</text>`;
  }
  const lane = (txt, y) => `<text class="lane" x="6" y="${y}">${txt}</text>`;
  const seps = [yA - 7, yJ - 7].map(y => `<line class="sep" x1="0" x2="${W}" y1="${y}" y2="${y}"/>`).join('');
  const ses = TL.S.map((o, k) => o.e < v0 || o.s > v1 ? '' : `<rect data-k="s${k}" data-w="${esc(o.w)}" x="${X(o.s)}" y="${yS + o.l * H}" width="${Math.max(3, X(o.e) - X(o.s))}" height="${H - 5}" rx="3" fill="${colorOf(o.node)}" data-tip="tl:${o.i}" tabindex="0"/>`
    + (o.sent ? `<circle cx="${X(o.e)}" cy="${yS + o.l * H + (H - 5) / 2}" r="4" fill="var(--n2)" stroke="var(--bg)" stroke-width="1.5"/>` : '')).join('');
  const sub = TL.A.map((o, k) => o.s < v0 || o.s > v1 ? '' : `<rect data-k="a${k}" x="${X(o.s) - 1.5}" y="${yA}" width="3" height="13" rx="1" fill="var(--n3)" data-tip="tl:${o.i}" tabindex="0"/>`).join('');
  const job = TL.J.map((o, k) => o.s < v0 || o.s > v1 ? '' : `<path data-k="j${k}" d="M${X(o.s)} ${yJ}l6 6.5-6 6.5-6-6.5z" fill="${o.c}" data-tip="tl:${o.i}" tabindex="0"/>`).join('');
  svg.setAttribute('viewBox', `0 0 ${W} ${h}`); svg.style.height = h + 'px';
  svg.innerHTML = `<defs><clipPath id="tlc"><rect x="${TG - 6}" y="0" width="${pw + 12}" height="${h}"/></clipPath></defs>${seps}
    ${lane('sesiones', yS + Math.min(TL.nl, 2) * H / 2 + 4)}${lane('subagentes', yA + 11)}${lane('trabajos', yJ + 11)}<g clip-path="url(#tlc)">${ticks}${ses}${sub}${job}</g>`;
  if (S.hl) mark(S.hl);
}
function bindTL(svg) {
  if (!svg) return;
  const P = new Map(); let moved = false;
  const tAt = (cx) => { const r = svg.getBoundingClientRect(); return TL.v[0] + (TL.v[1] - TL.v[0]) * Math.min(1, Math.max(0, (cx - r.left - TG) / (r.width - TG - TR))); };
  const setV = (a, span) => { span = Math.min(TL.t1 - TL.t0, Math.max(1800, span)); a = Math.min(Math.max(a, TL.t0), TL.t1 - span); TL.v = [a, a + span]; drawTL(); };
  const zoom = (f, cx) => { const [a, b] = TL.v, ta = cx == null ? (a + b) / 2 : tAt(cx), sp = Math.max(1800, Math.min(TL.t1 - TL.t0, (b - a) * f)); setV(ta - (ta - a) * sp / (b - a), sp); };
  svg.addEventListener('wheel', e => { e.preventDefault(); zoom(e.deltaY > 0 ? 1.25 : .8, e.clientX); }, {passive: false});
  svg.addEventListener('pointerdown', e => { P.set(e.pointerId, e.clientX); moved = false; });
  svg.addEventListener('pointermove', e => { if (!P.has(e.pointerId)) return;
    const prev = [...P.values()], old = P.get(e.pointerId); P.set(e.pointerId, e.clientX);
    if (P.size === 2) { const now_ = [...P.values()], d0 = Math.abs(prev[0] - prev[1]), d1 = Math.abs(now_[0] - now_[1]);
      if (d0 > 8 && d1 > 8) { moved = true; zoom(d0 / d1, (now_[0] + now_[1]) / 2); } return; }
    if (!moved && Math.abs(e.clientX - old) < 4) { P.set(e.pointerId, old); return; }
    if (!moved) { moved = true; svg.setPointerCapture(e.pointerId); }
    const r = svg.getBoundingClientRect(); setV(TL.v[0] - (e.clientX - old) / (r.width - TG - TR) * (TL.v[1] - TL.v[0]), TL.v[1] - TL.v[0]); });
  const up = e => P.delete(e.pointerId); svg.addEventListener('pointerup', up); svg.addEventListener('pointercancel', up);
  svg.addEventListener('click', e => { if (moved) return; const el = e.target.closest('[data-k]'); if (!el) return;
    const key = el.dataset.w ? 'w:' + el.dataset.w : el.dataset.k; mark(key);
    const r = document.querySelector(`#detail tr[data-hl="${CSS.escape(key)}"]`); if (r) r.scrollIntoView({block: 'nearest', behavior: 'smooth'}); });
  svg.addEventListener('dblclick', () => setV(TL.t0, TL.t1 - TL.t0));
  document.querySelectorAll('.tlbar [data-z]').forEach(b => b.onclick = () => +b.dataset.z ? zoom(+b.dataset.z) : setV(TL.t0, TL.t1 - TL.t0));
}
addEventListener('resize', () => drawTL());

// Highlight on the timeline what a row of the three lists points at; dim the rest.
function mark(key, row) {
  const svg = document.getElementById('tl'); if (!svg) return;
  const same = S.hl === key && row; S.hl = same ? null : key;
  svg.querySelectorAll('.hl').forEach(e => e.classList.remove('hl'));
  document.querySelectorAll('#detail tr.sel').forEach(r => r.classList.remove('sel'));
  svg.classList.toggle('focus', !!S.hl);
  if (!S.hl) return;
  const els = key.startsWith('w:') ? [...svg.querySelectorAll('[data-w]')].filter(e => e.dataset.w === key.slice(2)) : [...svg.querySelectorAll(`[data-k="${key}"]`)];
  els.forEach(e => e.classList.add('hl'));
  document.querySelectorAll(`#detail tr[data-hl="${CSS.escape(key)}"]`).forEach(r => r.classList.add('sel'));
  if (row) { document.getElementById('tlh').scrollIntoView({behavior: 'smooth', block: 'start'}); if (els[0]) setTimeout(() => showTip(els[0]), 350); }
}

// ---------------------------------------------------------------- local models
// Local models as a live inventory (F3 part 4): one card per model with its family logo and colour,
// the real model name next to the manager's key, and the owner's verdict (status + nota, stored by
// the manager in ~/modelos/estado.json). Quality per task as bars, best first; ★ = marked sirve/en uso.
const MST = {'en uso': 'var(--accent)', 'sirve': 'var(--good)', 'por probar': 'var(--muted)', 'no sirve': 'var(--crit)', 'descartado': 'var(--border)'};
const stOf = (m) => m.status || 'por probar';
const fam = (f) => icon('mf-' + f) || {};
const famIc = (f) => { const i = icon('mf-' + f); return i ? `<span class="lg mf" style="${cvars(i)}" title="${esc(i.name)}">${svgOf(i, 'mf-' + f)}</span>` : ''; };

function models() {
  const inv = D.models_inventory || {}, names = Object.keys(inv);
  if (!names.length) return `<section id="modelos"><h2>Modelos locales</h2><div class="card empty">El gestor de modelos no respondió /catalog en la última vuelta (o el colector del aparato aún no lo lee).</div></section>`;
  return `<section id="modelos"><h2>Modelos locales</h2>${names.map(n => modelsOf(n, inv[n])).join('')}</section>`;
}
function modelsOf(n, c) {
  const K = {}; (c.models || []).forEach(m => { const k = K[m.key] || (K[m.key] = {...m, tasks: [], rows: []}); k.tasks.push(m.task); k.rows.push(m); });
  const M = c.measurements || [], J = c.jobs || [], mDay = (r) => r.ts ? day(r.ts) : (r.date || '');
  const tasks = [...new Set((c.models || []).map(m => m.task))].sort(), days = [...new Set(M.map(mDay).filter(Boolean))].sort().reverse();
  const okT = (t) => !S.mt || t === S.mt, okD = (d) => !S.md || d === S.md, okS = (m) => !S.ms || stOf(m) === S.ms, order = Object.keys(MST);
  const cards = Object.values(K).filter(m => m.tasks.some(okT) && okS(m)).sort((a, b) => order.indexOf(stOf(a)) - order.indexOf(stOf(b)) || a.key.localeCompare(b.key)).map(m => {
    const l = m.rows.map(r => r.last).filter(Boolean).sort((x, y) => (y.date || '').localeCompare(x.date || ''))[0];
    return `<div class="card mcard" style="--fc:${(fam(m.family).color || {}).d || 'var(--muted)'}"><div class="mh">${famIc(m.family)}<div><b>${esc(m.name || (m.repo || '').split('/').pop() || m.key)}</b>
      <div class="muted mono" style="font-size:11px">${esc(m.key)} · ${esc(fam(m.family).name || '')}</div></div></div>
      <div class="mt">${m.tasks.map(t => `<span class="chip">${esc(t)}</span>`).join('')}${m.gb != null ? `<span class="muted">${m.gb} GB</span>` : ''}${m.downloaded ? '' : '<span class="muted">no descargado</span>'}</div>
      <div class="medit" data-mk="${esc(m.key)}"><button class="mst" type="button" style="--sc:${MST[stOf(m)]}"${D.redacted ? ' disabled' : ' title="cambiar estado"'}>${esc(stOf(m))}${m.status ? '' : ' · sin marcar'}</button>
      ${m.nota ? `<div class="muted" style="font-size:12px">${esc(m.nota)}</div>` : ''}</div>
      <div class="muted" style="font-size:12px">${l ? `${l.ok === false ? '✗ ' : ''}${esc(l.quality_label || '')} · ${l.speed != null ? esc(l.speed) + ' ' + esc(l.speed_unit || '') : ''} · ${esc(l.date || '')}` : 'sin medir'}</div></div>`; }).join('');
  const best = [], bars = (S.mt ? [S.mt] : tasks).map(t => {
    const by = {}; M.filter(r => r.task === t && okD(mDay(r)) && r.quality != null).forEach(r => { if (!by[r.key] || (r.ts || 0) >= (by[r.key].ts || 0)) by[r.key] = r; });
    const B = Object.values(by).sort((x, y) => y.quality - x.quality); if (!B.length) return '';
    const mx = Math.max(...B.map(r => r.quality)) || 1, good = (k) => ['en uso', 'sirve'].includes((K[k] || {}).status);
    const top = B.find(r => good(r.key)); if (top) best.push(`${esc(t)}: <b>${esc(top.key)}</b>`);
    return `<div class="qbars"><h4>${esc(t)} <span class="muted">· ${esc(B[0].quality_label || 'calidad')}</span></h4>${B.map(r => { const m = K[r.key] || {};
      const tm = med(J.filter(j => j.model === r.key && j.task === t && j.state === 'done').map(j => j.run_s));
      return `<div class="qb${good(r.key) ? ' ok' : ''}" style="--w:${(100 * r.quality / mx).toFixed(1)}%;--fc:${(fam(m.family).color || {}).d || 'var(--muted)'}"><span>${famIc(m.family)}${esc(r.key)}${good(r.key) ? ' ★' : ''}</span><i></i>
        <span class="n">${esc(r.quality)} · ${tm != null ? 'mediana ' + sec(tm) : r.speed != null ? esc(r.speed) + ' ' + esc(String(r.speed_unit || '').replace(/\s*\(.*\)/, '')) : '—'}</span></div>`; }).join('')}</div>`; }).join('');
  const mRows = M.filter(r => okT(r.task) && okD(mDay(r))).map(r => `<tr><td class="mono">${r.ts ? (r.ts_from === 'archivo' ? '~' : '') + dtm(r.ts) : esc(r.date || '—')}</td>
      <td><b>${esc(r.key)}</b></td><td>${esc(r.task)}</td><td>${r.ok ? '<span class="st-ok">✓</span>' : '<span class="st-bad">✗</span>'}</td>
      <td class="n">${r.quality != null ? esc(r.quality) : '—'}</td><td class="n">${r.speed != null ? esc(r.speed) + ' ' + esc(r.speed_unit || '') : '—'}</td><td class="n">${r.footprint_mb ? (r.footprint_mb/1024).toFixed(1) + ' GB' : '—'}</td><td class="wrap muted">${esc(r.note || '')}</td></tr>`).join('');
  const jRows = J.filter(j => okT(j.task) && okD(day(j.created))).slice(0, 60).map(j => `<tr><td class="mono">${dtm(j.created)}</td><td>${esc(j.task)}</td><td>${esc(j.model || '—')}</td>

// Motion with a purpose (F3 §16): numbers count up when the page loads, jobs newer than the last
// visit fade in, a redrawn block fades in, the "hace N s" text ticks. The freshness pulse is the
// only loop. prefers-reduced-motion turns all of it off.
const CALM = matchMedia('(prefers-reduced-motion: reduce)').matches;
let SEEN = 0, tick = null;
try { SEEN = +sessionStorage.getItem('visor-seen') || 0; } catch (e) {}
function countUp() {
  if (CALM) return;
  document.querySelectorAll('.g-kpi .kpi .v, .usd.xl, .usd.l').forEach(el => {
    const w = [...el.childNodes].find(x => x.nodeType === 3 && /\d/.test(x.textContent)); if (!w) return;
    const txt = w.textContent, m = txt.match(/\d[\d,]*(\.\d+)?/), end = parseFloat(m[0].replace(/,/g, '')), dec = (m[1] || '.').length - 1, t0 = performance.now();
    const f = (v) => dec ? v.toFixed(dec) : m[0].includes(',') ? Math.round(v).toLocaleString('es-PE') : String(Math.round(v));
    const step = (t) => { const k = Math.min(1, (t - t0) / 700); w.textContent = txt.replace(m[0], f(end * (1 - Math.pow(1 - k, 3)))); if (k < 1) requestAnimationFrame(step); };
    requestAnimationFrame(step); });
}

function render() {

  try { sessionStorage.setItem('visor-seen', String(Math.max(SEEN, ...(D.jobs || []).map(j => j.t0 || 0)))); } catch (e) {}
  const P = problems(), chip = document.getElementById('alertchip');

// One delegated tooltip: charts and timeline ([data-tip="<chart>:<i>"]) and tech chips
// ([data-tt] name + [data-tw] what it is, the Landing's chip tooltip). Hover, focus and tap.
let showTip = () => {};
(function tooltips() {
  const tip = document.getElementById('tip');
  let on = null;
  const sel = '[data-tip],[data-tt]';
  const show = (el) => { let html;
    if (el.dataset.tt) html = `<b>${esc(el.dataset.tt)}</b>${el.dataset.tw ? `<span class="w">${esc(el.dataset.tw)}</span>` : ''}`;
    else { const [k, i] = el.dataset.tip.split(':'); html = (TIPS[k] || [])[+i]; }
    if (!html) return;
    if (on) on.classList.remove('on'); on = el; el.classList.add('on');
    tip.innerHTML = html; tip.style.display = 'block'; const r = el.getBoundingClientRect();
    tip.style.left = Math.max(8, Math.min(r.left + r.width / 2 - tip.offsetWidth / 2, innerWidth - tip.offsetWidth - 8)) + 'px';
    const above = r.top - tip.offsetHeight - 8;
    tip.style.top = (above >= 8 ? above : r.bottom + 8) + 'px'; };
  showTip = show;
  const hide = () => { tip.style.display = 'none'; if (on) on.classList.remove('on'); on = null; };
  document.addEventListener('mouseover', e => { const el = e.target.closest && e.target.closest(sel); el ? show(el) : hide(); });
  document.addEventListener('focusin', e => { const el = e.target.closest && e.target.closest(sel); if (el) show(el); });
  document.addEventListener('focusout', hide);
  document.addEventListener('click', e => { const el = e.target.closest && e.target.closest(sel); el ? show(el) : hide(); });
  addEventListener('scroll', hide, {passive: true});
})();

const WINS = {'15': 900, '60': 3600, '240': 14400};
function spark(rows, key, label, unit, max, col, win) {
  const vals = rows.map(r => r[key]);
  const known = vals.filter(v => v != null);
  if (!known.length) return `<div class="card spark"><div class="sh"><span>${label}</span><b>n/d</b></div><div class="muted" style="font-size:12px;padding:20px 0">sin datos en esta ventana</div></div>`;
  const top = max || Math.max(1, ...known) * 1.15, W = 300, H = 64, n = Math.max(2, rows.length);
  let d = '', pen = false;
  vals.forEach((v, i) => { if (v == null) { pen = false; return; }
    const x = (i / (n - 1) * W).toFixed(1), y = (H - 2 - (H - 4) * Math.min(1, v / top)).toFixed(1);
    d += (pen ? 'L' : 'M') + x + ' ' + y + ' '; pen = true; });
  const last = known[known.length - 1], peak = Math.max(...known);
  return `<div class="card spark"><div class="sh"><span>${label}</span><span>ahora <b>${(+last).toFixed(unit === '%' ? 0 : 1)} ${unit}</b> · máx ${(+peak).toFixed(unit === '%' ? 0 : 1)}</span></div>
    <svg viewBox="0 0 ${W} ${H}" preserveAspectRatio="none" role="img" aria-label="${label}: ahora ${last} ${unit}"><path d="${d}" fill="none" stroke="${col}" stroke-width="1.6" vector-effect="non-scaling-stroke"/></svg><div class="gs swin">${win || ''}</div></div>`;
}
function reposoBlock(n) {
  // prompt 19 §2.4: the rules are shown with their numbers (thresholds.json), not as a bare light
  const all = LIVE.reposo, u = LIVE.reposo_umbrales;
  if (all === undefined) return '';
  const rp = all ? all[n] : null;
  const head = '<h3 style="margin:14px 0 6px">Reposo</h3>';
  if (!u || rp == null) return head + '<div class="empty">⚠ umbrales: no se pudo leer <code>thresholds.json</code>; sin veredicto de reposo.</div>';
  const m = s => Math.round(s / 60);
  const rules = `<ul class="note" style="margin:6px 0 0 18px;padding:0">
    <li>presión de memoria ≠ normal durante ≥ ${m(u['visor-reposo-pressure-s'])} min → «sin memoria»: no se despacha más aquí (<code>run</code> encola o va a otro nodo; <code>watch</code> retiene la cola)</li>
    <li>límite de velocidad de CPU &lt; 100 % durante ≥ ${m(u['visor-reposo-thermal-s'])} min → «estrangulando térmicamente» (aviso)</li>
    <li>swap creciendo ≥ ${u['visor-reposo-swap-gb']} GB en ${m(u['visor-reposo-swap-window-s'])} min → «paginando» (aviso)</li></ul>
    <div class="note">Números editables en <code>~/.claude/rules/thresholds.json</code> (<code>visor-reposo-*</code>).</div>`;
  const fired = rp.length ? rp.map(r => `<div class="card" style="margin:6px 0;padding:8px 10px;border-left:4px solid ${r.no_dispatch ? 'var(--crit)' : 'var(--warn)'}"><b>${esc(r.msg)}</b><div class="note">desde hace ${ago(r.held_s)}${r.no_dispatch ? ' · no se despacha aquí' : ' · solo aviso'}</div></div>`).join('')
    : `<div class="note" style="color:var(--good)">Ninguna regla de reposo activa en ${esc(lab(n))}.</div>`;
  return head + fired + rules;
}

function drawDetail() {
  const box = document.getElementById('teledet'); if (!box) return;
  const n = S.tn; if (!n || !LIVE) { box.innerHTML = ''; return; }
  const t = TEL(n), cfg = (LIVE.nodos || {})[n] || {}, m = (t || {}).mem || {}, c = (t || {}).cpu || {}, g = (t || {}).gpu || {}, th = (t || {}).thermal || {}, io = (t || {}).io || {};
  const tw = S.tw && WINS[S.tw] ? S.tw : '60', since = Date.now() / 1000 - WINS[tw];
  const rows = ((RING || {})[n] || []).filter(r => (Date.parse(r.at) / 1000) >= since);
  const memPct = m.total_gb && m.used_gb != null ? 100 * m.used_gb / m.total_gb : m.load_pct;
  const thTxt = th.cpu_speed_limit != null ? (th.cpu_speed_limit < 100 ? `estrangulando: ${th.cpu_speed_limit} %` : 'sin límite') : th.throttled === false ? 'sin aviso térmico' : 'n/d';
  const nt = nowTxt(n), st = stepS(rows), tAgo = t && isoTs(t.at) != null ? ago(Date.now() / 1000 - isoTs(t.at)) : '—';
  const win = `últimos ${tw === '240' ? '4 h' : tw === '60' ? '1 h' : '15 min'}${st ? ` · 1 punto / ${ago(st)}` : ''}`;
  const procs = ((t || {}).top || []).slice().sort((a, b) => (b.tag ? 1 : 0) - (a.tag ? 1 : 0) || b.cpu - a.cpu);
  box.innerHTML = `<div class="card" style="margin-top:12px"><div class="nsel"><h3 style="margin:0 8px 0 0">Detalle</h3>
      ${NODES.map(x => `<button class="btn ${x === n ? 'on' : ''}" type="button" data-tsel="${esc(x)}">${dev(x)}</button>`).join('')}
      <span class="muted" style="margin-left:auto;font-size:12px">los gauges siempre son ahora; el selector solo cambia las curvas</span><span class="seg">${Object.keys(WINS).map(w => `<button class="btn ${w === tw ? 'on' : ''}" type="button" data-twin="${w}">${w === '240' ? '4 h' : w === '60' ? '1 h' : '15 min'}</button>`).join('')}
      <button class="btn" type="button" data-tclose="1" aria-label="Cerrar detalle">✕</button></span></div>
    ${!t ? `<div class="empty">Sin telemetría de ${esc(lab(n))}${cfg.error ? ` (${esc(deid(cfg.error))})` : ''}.</div>` : `
    <div class="gauges">
      ${gauge('CPU', c.pct, `${c.cores || '?'} núcleos${c.p_cores_n ? ` (${c.p_cores_n}P+${c.e_cores_n}E)` : ''}${c.load1 != null ? ' · carga ' + c.load1 : ''}`, null, nt)}
      ${gauge('GPU', g.pct, g.source === 'n/d' ? 'sin lectura fiable' : `${g.vram_used_gb != null ? gb(g.vram_used_gb) + ' VRAM · ' : ''}${g.temp_c != null ? g.temp_c + ' °C · ' : ''}${esc(g.source || '')}`, null, nt)}
      ${gauge('RAM', memPct, `${gb(m.used_gb)} de ${gb(m.total_gb)}${m.compressed_gb != null ? ' · compr. ' + gb(m.compressed_gb) : ''}${m.swap_used_gb != null ? ' · swap ' + gb(m.swap_used_gb) : ''}${m.pressure ? ' · presión ' + m.pressure : ''}`, {ok: 'var(--good)', warn: 'var(--warn)', crit: 'var(--crit)'}[presLvl(m)], nt)}
      <div class="card gauge"><div class="gv" style="margin-top:14px;color:${th.throttled ? 'var(--warn)' : th.throttled === false ? 'var(--good)' : 'var(--muted)'}">${esc(thTxt)}</div><div class="gl">Térmico</div><div class="gs">${th.temp_c != null ? th.temp_c + ' °C' : osOf(n) === 'darwin' ? 'temperatura en grados: n/d (sin sudo)' : 'temperatura en grados: n/d (Windows no la expone en esta placa)'}</div>${nt}</div>
      <div class="card gauge"><div class="gv" style="margin-top:14px">${io.net_in_mb_s == null ? 'n/d' : `↓${io.net_in_mb_s} ↑${io.net_out_mb_s}`}</div><div class="gl">Red (MB/s)</div><div class="gs">${io.iface ? 'entra por ' + esc(ifTxt(io)) + ' · ' : ''}disco I/O: ${io.disk_mb_s == null ? 'n/d' : io.disk_mb_s + ' MB/s'}</div>${nt}</div>
    </div>
    <div class="sparks">
      ${spark(rows, 'cpu', 'CPU', '%', 100, 'var(--accent)', win)}
      ${spark(rows, 'gpu', 'GPU', '%', 100, 'var(--n3)', win)}
      ${spark(rows, 'mem', 'RAM usada', 'GB', m.total_gb || null, 'var(--n2)', win)}
      ${spark(rows, 'net_in', 'Red entrada', 'MB/s', null, 'var(--n5)', win)}
    </div>
    <h3 style="margin:14px 0 6px">Procesos · top ${procs.length} <span class="muted" style="font-size:12px;font-weight:400">· muestra de hace ${tAgo}</span></h3>
    <div class="scroll"><table><thead><tr><th>Proceso</th><th>PID</th><th>CPU</th><th>Memoria</th><th>Del enjambre</th></tr></thead><tbody>
      ${procs.map(r => `<tr><td class="mono">${esc(r.name)}</td><td class="mono">${r.pid}</td><td class="mono">${(+r.cpu).toFixed(0)} %</td><td class="mono">${gb(r.rss_gb)}</td><td>${r.tag ? `<span class="ptag">${esc(r.tag)}</span>` : ''}</td></tr>`).join('')}</tbody></table></div>
    ${reposoBlock(n)}
    <div class="note">CPU de proceso en % de un núcleo (400 % = 4 núcleos llenos). ${osOf(n) === 'darwin' ? 'En macOS es la media móvil de <code>ps</code> (~1 min); el total sale de los contadores del kernel.' : 'En Windows, dos muestras de 200 ms.'} Leído hace ${ago(Date.now() / 1000 - Date.parse(t.at) / 1000)} en ${t.ms} ms${cfg.lat_ms != null && cfg.lat_ms > t.ms ? ` (${cfg.lat_ms} ms con ssh)` : ''}${cfg.slow ? ' · nodo lento: se lee cada 60 s' : ''}. Lo que no se puede leer dice «n/d», nunca 0.</div>`}</div>`;
}
document.addEventListener('click', e => {
  const b = e.target.closest && e.target.closest('[data-tdet],[data-tsel],[data-twin],[data-tclose]'); if (!b) return;
  if (b.dataset.tdet || b.dataset.tsel) S.tn = b.dataset.tdet || b.dataset.tsel;
  if (b.dataset.twin) S.tw = b.dataset.twin;
  if (b.dataset.tclose) S.tn = null;
  writeHash();
  if (S.tn) { loadRing(); if (b.dataset.tdet) setTimeout(() => document.getElementById('teledet').scrollIntoView({behavior: CALM ? 'auto' : 'smooth', block: 'start'}), 60); } else drawDetail();
});

async function load() {
  if (D && !D.__fetched) { render(); if (!D.redacted) { watchStamp(); watchLive(); } return; }   // --demo copies have no stamp   // local file:// copy, data embedded
  try {
    const r = await fetch(DATA_URL, {credentials: 'same-origin', cache: 'no-store'});
    if (!r.ok) throw new Error('HTTP ' + r.status);
    D = await r.json(); D.__fetched = true; render();
  } catch (e) {
    document.getElementById('app').innerHTML = `<div class="card err">No se pudo leer la instantánea (${esc(e.message)}).</div>`;
  }
  setTimeout(load, 120000);
}
load();
</script>
</body>
